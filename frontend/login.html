<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso à Conta | Agendou!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full">
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center space-x-2">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
          <i class="fa-solid fa-calendar-check"></i>
        </div>
        <span class="text-2xl font-black text-slate-900">Agendou<span class="text-indigo-600">!</span></span>
      </a>
      <p class="text-xs text-slate-500 mt-2 font-medium">Plataforma de Agendamentos & Avaliações Inteligentes</p>
    </div>

    <!-- Main Card -->
    <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-200/80">
      
      <!-- Abas: Entrar vs Cadastrar -->
      <div class="flex border-b border-slate-100 mb-6 pb-2">
        <button id="tab-login" onclick="alternarAba('login')" class="flex-1 pb-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 transition">
          Fazer Login
        </button>
        <button id="tab-register" onclick="alternarAba('register')" class="flex-1 pb-3 text-sm font-bold text-slate-400 hover:text-slate-600 transition">
          Criar Conta
        </button>
      </div>

      <!-- Formulário de Login (RF01) -->
      <form id="form-login" class="space-y-4" onsubmit="event.preventDefault(); alert('Login efetuado! Redirecionando...'); window.location.href = 'agendamento.html';">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">E-mail</label>
          <div class="relative">
            <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400 text-sm"></i>
            <input type="email" value="cliente@exemplo.com" required placeholder="seu@email.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Senha</label>
            <a href="#" class="text-xs font-semibold text-indigo-600 hover:underline">Esqueceu?</a>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>
            <input type="password" value="123456" required placeholder="Sua senha secreta" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/25 transition">
            Entrar na Plataforma
          </button>
        </div>

        <div class="text-center pt-3 border-t border-slate-100">
          <p class="text-xs text-slate-500">É um prestador de serviços? <a href="dashboard-prestador.html" class="text-indigo-600 font-bold hover:underline">Acessar Painel Direto</a></p>
        </div>
      </form>

      <!-- Formulário de Cadastro (RF01 & RF02) -->
      <form id="form-register" class="space-y-4 hidden" onsubmit="event.preventDefault(); alert('Conta criada com sucesso!'); alternarAba('login');">
        <!-- Seleção de Perfil -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Qual é o seu perfil?</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="border-2 border-indigo-600 bg-indigo-50/50 p-3 rounded-xl flex items-center space-x-2 cursor-pointer text-xs font-bold text-indigo-700">
              <input type="radio" name="tipo_perfil" value="Cliente" checked onchange="toggleCamposPrestador(false)" class="text-indigo-600">
              <span>👤 Sou Cliente</span>
            </label>
            <label class="border-2 border-slate-200 p-3 rounded-xl flex items-center space-x-2 cursor-pointer text-xs font-bold text-slate-600 hover:border-slate-300">
              <input type="radio" name="tipo_perfil" value="Prestador" onchange="toggleCamposPrestador(true)" class="text-indigo-600">
              <span>🛠️ Sou Prestador</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nome Completo</label>
          <input type="text" required placeholder="Seu nome ou Razão Social" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">E-mail</label>
          <input type="email" required placeholder="seu@email.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Telefone / WhatsApp</label>
          <input type="tel" required placeholder="(11) 99999-9999" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>

        <!-- Campos adicionais caso Prestador (RF02) -->
        <div id="campos-prestador" class="space-y-4 hidden border-t border-slate-100 pt-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-indigo-700 mb-1.5">Nome do Estabelecimento / Negócio</label>
            <input type="text" placeholder="Ex: Barbearia Estilo, Studio Bella" class="w-full px-4 py-2.5 bg-indigo-50/30 border border-indigo-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-indigo-700 mb-1.5">Endereço Completo</label>
            <input type="text" placeholder="Rua, Número, Bairro e Cidade" class="w-full px-4 py-2.5 bg-indigo-50/30 border border-indigo-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Criar Senha Segura</label>
          <input type="password" required placeholder="Mínimo 6 caracteres" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
          <p class="text-[11px] text-slate-400 mt-1">Criptografia com hash bcrypt no banco (RNF03)</p>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/25 transition">
            Finalizar Cadastro
          </button>
        </div>
      </form>

    </div>

    <!-- Voltar para home -->
    <div class="text-center mt-6">
      <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> Voltar para a página inicial
      </a>
    </div>
  </div>

  <script>
    function alternarAba(aba) {
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');

      if (aba === 'login') {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        tabLogin.className = 'flex-1 pb-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 transition';
        tabRegister.className = 'flex-1 pb-3 text-sm font-bold text-slate-400 hover:text-slate-600 transition';
      } else {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        tabRegister.className = 'flex-1 pb-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 transition';
        tabLogin.className = 'flex-1 pb-3 text-sm font-bold text-slate-400 hover:text-slate-600 transition';
      }
    }

    function toggleCamposPrestador(isPrestador) {
      const div = document.getElementById('campos-prestador');
      if (isPrestador) div.classList.remove('hidden');
      else div.classList.add('hidden');
    }

    // Checa parâmetro da URL (?tab=register)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'register') {
      alternarAba('register');
    }
  </script>
</body>
</html>
